# Codex Smart Router — default profile
# Root/orchestrator: GPT-6 Astra
# Cheap/default subagents: GPT-5.6 Luna
# If Astra is not available yet, use the Sol fallback in /fallbacks.

model = "gpt-6-astra"
model_reasoning_effort = "low"

[agents]
enabled = true
max_concurrent_threads_per_session = 4
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "medium"
